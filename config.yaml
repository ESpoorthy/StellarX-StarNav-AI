# ─────────────────────────────────────────────────────────────────────────────
# StellarX-StarNav-AI — Project Configuration Template
#
# All runtime parameters are centralised here.
# Do NOT hard-code paths or hyperparameters inside source files.
# Values marked "null" or with a comment "# TBD" are intentional placeholders
# to be filled in during the corresponding development phase.
# ─────────────────────────────────────────────────────────────────────────────

project:
  name: StellarX-StarNav-AI
  version: "0.1.0"
  team: StellarX
  description: >
    Neural-network-based star pattern recognition
    for autonomous spacecraft navigation.

# ── Data paths ────────────────────────────────────────────────────────────────
data:
  raw_dir: data/raw
  processed_dir: data/processed
  catalog_dir: data/catalog
  # Image format for star-field inputs (decided in Phase 1)
  image_format: png            # lossless PNG; FITS support planned for Phase 2
  image_size: [512, 512]       # [height, width] in pixels

# ── Preprocessing (Phase 2) ───────────────────────────────────────────────────
preprocessing:
  # Background subtraction
  background_subtraction: true      # enable background removal
  background_method: median_filter  # "median_filter" | "constant"
  background_filter_size: 31        # odd integer; kernel size for median filter

  # Noise reduction
  noise_reduction: true             # enable noise reduction
  noise_method: gaussian            # "gaussian" | "none"
  noise_sigma: 0.8                  # Gaussian blur sigma (pixels)

  # Intensity normalisation (applied after background + noise steps)
  normalization: min_max            # "min_max" | "z_score" | "none"

# ── Star detection (Phase 2) ──────────────────────────────────────────────────
star_detection:
  # Thresholding
  threshold_method: absolute        # "absolute" | "sigma_clip"
  min_brightness: 0.05              # absolute: min normalised pixel value (0–1)
  sigma_clip_k: 5.0                 # sigma_clip: threshold = median + k * sigma

  # Morphological filtering
  min_area_px: 1                    # minimum blob area (pixels)
  max_area_px: 200                  # maximum blob area (pixels) — rejects large artifacts
  min_peak_brightness: 0.04         # minimum peak pixel value in blob

  # Output
  max_stars: 50                     # maximum candidates returned per image

  # Centroiding
  centroid_method: intensity_weighted   # "intensity_weighted" | "peak"
  centroid_half_window: 5               # half-size of centroiding window (pixels)


# ── Feature extraction (Phase 3) ──────────────────────────────────────────────
features:
  # Number of brightest stars used to build the feature vector
  max_stars: 10
  # Descriptor type (pairwise_distances | pairwise_distances_and_ratios)
  descriptor: pairwise_distances_and_ratios
  # Image dimensions used for normalisation (must match dataset.image_width/height)
  image_width: 512
  image_height: 512

# ── Model (Phase 3 — scikit-learn classifier) ────────────────────────────────
model:
  # Backend: "sklearn" is active for Phase 3; "pytorch" is planned for Phase 4+
  backend: sklearn
  # Sklearn classifier type: "random_forest" | "knn" | "mlp"
  classifier_type: random_forest
  # RandomForest hyperparameters
  n_estimators: 200
  max_depth: null                # null = unlimited
  # KNN hyperparameters
  n_neighbors: 5
  # MLP hyperparameters (hidden layer sizes as a list)
  mlp_hidden_layers: [256, 128]
  # Output
  checkpoint_dir: models
  checkpoint_name: star_pattern_classifier.pkl
  # PyTorch architecture (deferred — Python 3.14 not yet supported by torch)
  architecture: null             # TBD when PyTorch supports Python 3.14
  input_channels: null           # TBD
  output_classes: null           # TBD — set automatically from catalog size

# ── Training (Phase 3) ────────────────────────────────────────────────────────
training:
  # Sklearn does not use mini-batch gradient descent; these apply to the
  # PyTorch path when it becomes available
  batch_size: null               # PyTorch TBD
  epochs: null                   # PyTorch TBD
  learning_rate: null            # PyTorch TBD
  optimizer: null                # PyTorch TBD
  lr_scheduler: null             # PyTorch TBD
  weight_decay: null             # PyTorch TBD
  seed: 42                       # fixed for reproducibility (used in sklearn too)
  device: null                   # auto-detected at runtime for PyTorch

# ── Evaluation (Phase 3) ─────────────────────────────────────────────────────
evaluation:
  confidence_threshold: 0.3      # minimum probability for an accepted prediction
  top_k: 3                       # top-k accuracy metric

# ── Navigation (Phase 5) ─────────────────────────────────────────────────────
navigation:
  attitude_method: wahba_svd         # Wahba/SVD weighted least-squares
  position_method: unavailable       # single-image position not observable

  # Wahba/SVD parameters
  min_correspondences: 2             # minimum inliers for valid attitude
  max_residual_threshold_deg: 2.0    # maximum mean residual for is_valid=True
  outlier_rejection_threshold_deg: 2.0  # per-star residual threshold for rejection
  outlier_rejection_max_iter: 3      # iterations of outlier rejection
  attitude_confidence_threshold: 0.3 # minimum confidence for valid result

# ── Dataset generation (Phase 1) ──────────────────────────────────────────────
dataset:
  # Catalog
  catalog_file: data/catalog/hipparcos_bright.csv   # path to star catalog CSV
  catalog_mag_limit: 6.5                            # faint magnitude cutoff (inclusive)

  # Synthetic image dimensions
  image_width: 512                                  # pixels
  image_height: 512                                 # pixels

  # Simulated sensor / optics
  field_of_view_deg: 20.0                           # full field of view in degrees
  # focal_length_mm is derived from image_size and fov; not set independently here

  # Star rendering
  max_stars_per_image: 30                           # cap on stars rendered per frame
  psf_sigma_px: 1.5                                 # Gaussian PSF sigma in pixels
  min_star_flux: 0.05                               # minimum normalised flux (faintest rendered star)

  # Background and noise
  background_level: 0.02                            # mean background as fraction of max intensity
  read_noise_sigma: 0.005                           # Gaussian read-noise sigma (fraction of max)
  shot_noise: true                                  # apply Poisson-like shot noise to star flux

  # Random artifacts (hot pixels, cosmic rays)
  artifact_probability: 0.01                        # probability of a random artifact per image

  # Dataset size and splitting
  num_train: 800
  num_val: 100
  num_test: 100
  random_seed: 42                                   # global seed for reproducibility

  # Output
  output_dir: data/raw                              # generated images saved here
  metadata_file: data/raw/metadata.json             # ground-truth metadata for all samples
  image_format: png                                 # "png" | "tiff"  (lossless)

# ── Application (Streamlit) ───────────────────────────────────────────────────
application:
  host: "localhost"
  port: 8501
  title: "StellarX — Star Pattern Recognition"
  debug: false
